services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: builderstech
      POSTGRES_USER: builderstech
      POSTGRES_PASSWORD: builderstech
    ports:
      - "5433:5432"
    volumes:
      - builderstech_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U builderstech"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - builderstech_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  builderstech_postgres:
  builderstech_uploads:
