name: builderstech
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend: { condition: service_healthy }
      api: { condition: service_healthy }
    networks: [edge, internal]

  frontend:
    build:
      context: .
      args: { NEXT_PUBLIC_API_URL: /api/v1 }
    restart: unless-stopped
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/admin"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    expose: ["8080"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    # `internal` keeps caddy/db/minio isolated; `egress` gives the API outbound
    # internet so it can reach the address-autocomplete geocoder.
    networks: [internal, egress]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    env_file: .env.production
    volumes: [minio_data:/data]
    expose: ["9000", "9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

networks:
  edge:
  internal:
    internal: true
  egress:

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
